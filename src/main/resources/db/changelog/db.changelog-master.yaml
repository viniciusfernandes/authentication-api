databaseChangeLog:
  # Consolidated schema of the "identity" bounded context (database: auth).
  # Contains only the final table definitions; the database is created from scratch.
  - changeSet:
      id: auth-schema-01
      author: vinicius
      changes:
        - sql:
            sql: |
              -- Users
              CREATE TABLE users (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                email VARCHAR(255) NOT NULL,
                password VARCHAR(255) NULL,
                full_name VARCHAR(255) NOT NULL,
                phone VARCHAR(50) NULL,
                profile_picture VARCHAR(512) NULL,
                status VARCHAR(32) NOT NULL,
                email_verified BOOLEAN NOT NULL DEFAULT FALSE,
                email_verification_token VARCHAR(255) NULL,
                email_verification_token_expiry TIMESTAMP NULL,
                password_reset_token VARCHAR(255) NULL,
                password_reset_token_expiry TIMESTAMP NULL,
                external_provider_id VARCHAR(255) NULL,
                external_provider VARCHAR(32) NULL,
                created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP NULL,
                CONSTRAINT uk_users_email UNIQUE (email)
              );

              -- One-time tokens (email verification, password reset, ...)
              CREATE TABLE tokens (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                token VARCHAR(255) NOT NULL,
                type VARCHAR(32) NOT NULL,
                user_id BIGINT NOT NULL,
                expires_at TIMESTAMP NOT NULL,
                used BOOLEAN NOT NULL DEFAULT FALSE,
                created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT fk_tokens_user FOREIGN KEY (user_id) REFERENCES users (id) ON DELETE CASCADE
              );

              CREATE INDEX idx_tokens_token_type ON tokens (token, type);
              CREATE INDEX idx_tokens_user ON tokens (user_id);

              -- Catalog of the claims that can be written into the JWT (e.g. companyId)
              CREATE TABLE claims (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                name VARCHAR(100) NOT NULL,
                description VARCHAR(255) NULL,
                value_type VARCHAR(16) NOT NULL DEFAULT 'STRING',
                CONSTRAINT uk_claims_name UNIQUE (name),
                CONSTRAINT ck_claims_value_type CHECK (value_type IN ('STRING', 'INTEGER', 'BOOLEAN'))
              );

              -- N-N between users and claims; "value" is the value of the claim for that user
              CREATE TABLE user_claims (
                user_id BIGINT NOT NULL,
                claim_id BIGINT NOT NULL,
                value VARCHAR(255) NOT NULL,
                CONSTRAINT pk_user_claims PRIMARY KEY (user_id, claim_id),
                CONSTRAINT fk_user_claims_user FOREIGN KEY (user_id) REFERENCES users (id) ON DELETE CASCADE,
                CONSTRAINT fk_user_claims_claim FOREIGN KEY (claim_id) REFERENCES claims (id) ON DELETE CASCADE
              );

              CREATE INDEX idx_user_claims_claim ON user_claims (claim_id);
