services:
  postgres:
    image: postgres:16-alpine
    container_name: authentication-postgres
    environment:
      POSTGRES_USER: authenticator
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: auth
    volumes:
      - app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authenticator -d auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  authentication-api:
    image: viniciussf/authentication-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authentication-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth
      SPRING_DATASOURCE_USERNAME: authenticator
      SPRING_DATASOURCE_PASSWORD: admin
      JWT_SECRET: change-me-in-prod
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      FACEBOOK_CLIENT_ID: ""
      FACEBOOK_CLIENT_SECRET: ""
      FRONTEND_URL: http://localhost:3000
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8000"
    ports:
      - "8081:8080"
      - "8000:8000"

volumes:
  app_data:
